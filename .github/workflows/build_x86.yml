name: Build x86_64 Native Binary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SUBMODULE_DEPLOY_KEY }}

      - name: Update submodule to latest
        run: |
          cd src/DartLangModTool-master
          git fetch origin master
          git reset --hard origin/master

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version:' src/DartLangModTool-master/pubspec.yaml | sed 's/version: *//' | tr -d '\r\n')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Mod tool version: $VERSION"

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build native executable
        run: |
          cd src/DartLangModTool-master
          dart pub get
          dart compile exe bin/main.dart -o ../../mod_tool
          echo "Binary built:"
          file ../../mod_tool
          ls -lh ../../mod_tool

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod_tool-linux-x86_64-v${{ steps.version.outputs.version }}
          path: mod_tool
          retention-days: 90
