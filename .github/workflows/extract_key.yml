name: Extract deploy key
on: workflow_dispatch
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Write key to artifact
        env:
          DEPLOY_KEY: ${{ secrets.SUBMODULE_DEPLOY_KEY }}
        run: |
          mkdir -p output
          printf "%s" "$DEPLOY_KEY" > output/deploy_key
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-key
          path: output/deploy_key
          retention-days: 1
